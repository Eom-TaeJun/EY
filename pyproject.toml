[project]
name = "credit-risk-signal-lab"
version = "0.1.0"
description = "Traceable credit-risk SQL and validation harness"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "xlrd>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
model = [
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
]
report = [
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "python-docx>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
