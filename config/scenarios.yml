version: 0.2.0
status: deferred_pending_approved_assumptions
model_definition_version: 0.2.0
source_limit:
  observation_structure: one_common_borrower_observation_date
  macroeconomic_variables: unavailable
  eligible_exposure_at_default: unavailable
  recovery_and_collateral_cash_flows: unavailable
scenarios:
  base:
    status: not_parameterized
    description: Current observed behavior; no scenario multiplier is applied.
  downside:
    status: deferred
    description: Requires approved behavioral or macro shock assumptions.
  severe_downside:
    status: deferred
    description: Requires approved severe but explainable shock assumptions.
controls:
  - Scenario values must be sourced or explicitly labeled as sensitivity assumptions.
  - Direction and magnitude must be approved before calculation.
  - Scenario outputs cannot be described as IFRS 9 ECL without eligible PD, LGD, EAD, Stage, and weighting definitions.
  - Gate 4 sensitivity direction remains blocked while all non-base scenarios are unparameterized.
