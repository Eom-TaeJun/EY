<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
  <title id="title">Credit Risk Signal Lab portfolio evidence map</title>
  <desc id="description">A four-stage map from controlled source ingestion through SQL quality assurance and risk interpretation to governed Office handoff.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#829AB1"/>
    </marker>
    <style>
      .sans { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; fill: #627D98; }
      .headline { font-size: 34px; font-weight: 800; fill: #102A43; }
      .subhead { font-size: 17px; font-weight: 400; fill: #486581; }
      .card-title { font-size: 19px; font-weight: 800; fill: #102A43; }
      .card-copy { font-size: 14px; font-weight: 500; fill: #334E68; }
      .metric { font-size: 25px; font-weight: 800; fill: #102A43; }
      .metric-label { font-size: 12px; font-weight: 600; fill: #627D98; }
      .signal { font-size: 13px; font-weight: 750; fill: #243B53; }
      .footer { font-size: 12px; font-weight: 500; fill: #627D98; }
    </style>
  </defs>

  <rect width="1200" height="690" rx="28" fill="#F6F8FB"/>
  <rect x="0" y="0" width="16" height="690" rx="8" fill="#F2C94C"/>

  <g class="sans">
    <text x="64" y="62" class="eyebrow">EY FSRM INTERNSHIP PORTFOLIO · VERIFIED RUN W1-20260727-001</text>
    <text x="64" y="108" class="headline">낯선 신용데이터를 검토 가능한 리스크 증거로 전환</text>
    <text x="64" y="141" class="subhead">원천 보존, SQL 대사, 설명 가능한 위험 신호, 실행 ID 기반 Office 인계까지 한 흐름으로 구현</text>

    <line x1="302" y1="315" x2="342" y2="315" stroke="#829AB1" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="582" y1="315" x2="622" y2="315" stroke="#829AB1" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="862" y1="315" x2="902" y2="315" stroke="#829AB1" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="62" y="188" width="240" height="260" rx="18" fill="#FFFFFF"/>
      <rect x="62" y="188" width="240" height="10" rx="5" fill="#2F80ED"/>
      <circle cx="100" cy="235" r="20" fill="#E8F1FC"/>
      <text x="100" y="241" text-anchor="middle" class="card-title">1</text>
      <text x="130" y="242" class="card-title">Source control</text>
      <text x="86" y="286" class="card-copy">공식 UCI 원천 등록</text>
      <text x="86" y="312" class="card-copy">SHA-256 · 행/열 메타데이터</text>
      <text x="86" y="338" class="card-copy">원천값 불변 raw 적재</text>
      <line x1="86" y1="366" x2="278" y2="366" stroke="#D9E2EC"/>
      <text x="86" y="402" class="metric">30,000</text>
      <text x="86" y="423" class="metric-label">SOURCE = RAW = BORROWER</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="342" y="188" width="240" height="260" rx="18" fill="#FFFFFF"/>
      <rect x="342" y="188" width="240" height="10" rx="5" fill="#27AE60"/>
      <circle cx="380" cy="235" r="20" fill="#E7F7EE"/>
      <text x="380" y="241" text-anchor="middle" class="card-title">2</text>
      <text x="410" y="242" class="card-title">SQL QA</text>
      <text x="366" y="286" class="card-copy">6개월 wide-to-long 변환</text>
      <text x="366" y="312" class="card-copy">건수 · 청구 · 납부 합계 대사</text>
      <text x="366" y="338" class="card-copy">실패와 source warning 분리</text>
      <line x1="366" y1="366" x2="558" y2="366" stroke="#D9E2EC"/>
      <text x="366" y="402" class="metric">180,000</text>
      <text x="366" y="423" class="metric-label">CUSTOMER-MONTH · DIFFERENCE 0</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="622" y="188" width="240" height="260" rx="18" fill="#FFFFFF"/>
      <rect x="622" y="188" width="240" height="10" rx="5" fill="#9B51E0"/>
      <circle cx="660" cy="235" r="20" fill="#F2EAFB"/>
      <text x="660" y="241" text-anchor="middle" class="card-title">3</text>
      <text x="690" y="242" class="card-title">Risk signals</text>
      <text x="646" y="286" class="card-copy">상환행동 → 7개 측정 신호</text>
      <text x="646" y="312" class="card-copy">표본 수 · 실제 부도율 대사</text>
      <text x="646" y="338" class="card-copy">반대·비단조 결과도 보존</text>
      <line x1="646" y1="366" x2="838" y2="366" stroke="#D9E2EC"/>
      <text x="646" y="402" class="metric">11.69% → 51.36%</text>
      <text x="646" y="423" class="metric-label">LOW → HIGH OBSERVED DEFAULT RATE</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="902" y="188" width="240" height="260" rx="18" fill="#FFFFFF"/>
      <rect x="902" y="188" width="240" height="10" rx="5" fill="#F2994A"/>
      <circle cx="940" cy="235" r="20" fill="#FDF0E4"/>
      <text x="940" y="241" text-anchor="middle" class="card-title">4</text>
      <text x="970" y="242" class="card-title">Controlled handoff</text>
      <text x="926" y="286" class="card-copy">Excel · PowerPoint · Word</text>
      <text x="926" y="312" class="card-copy">claim-to-evidence lineage</text>
      <text x="926" y="338" class="card-copy">runbook · issue · decision log</text>
      <line x1="926" y1="366" x2="1118" y2="366" stroke="#D9E2EC"/>
      <text x="926" y="402" class="metric">0</text>
      <text x="926" y="423" class="metric-label">GATE 5 CROSS-ARTIFACT MISMATCH</text>
    </g>

    <text x="64" y="500" class="eyebrow">RECRUITER SIGNALS</text>
    <g>
      <rect x="62" y="522" width="166" height="46" rx="23" fill="#E8F1FC"/>
      <text x="145" y="551" text-anchor="middle" class="signal">SQL · PostgreSQL</text>
      <rect x="242" y="522" width="166" height="46" rx="23" fill="#E7F7EE"/>
      <text x="325" y="551" text-anchor="middle" class="signal">데이터 분석 · 테스트</text>
      <rect x="422" y="522" width="166" height="46" rx="23" fill="#F2EAFB"/>
      <text x="505" y="551" text-anchor="middle" class="signal">Risk Component 이해</text>
      <rect x="602" y="522" width="166" height="46" rx="23" fill="#FDF0E4"/>
      <text x="685" y="551" text-anchor="middle" class="signal">Excel · PPT · Word</text>
      <rect x="782" y="522" width="166" height="46" rx="23" fill="#EAF0F5"/>
      <text x="865" y="551" text-anchor="middle" class="signal">프로젝트 관리</text>
      <rect x="962" y="522" width="180" height="46" rx="23" fill="#FFF5CE"/>
      <text x="1052" y="551" text-anchor="middle" class="signal">통제 · 인수인계</text>
    </g>

    <rect x="62" y="600" width="1080" height="52" rx="12" fill="#102A43"/>
    <text x="86" y="632" font-size="14" font-weight="650" fill="#FFFFFF">
      통제 경계 · 공개 횡단면 데이터 기반 prototype — 실제 은행 IFRS 9 Stage·PD·LGD·EAD·ECL 승인 결과가 아님
    </text>
    <text x="1138" y="674" text-anchor="end" class="footer">Source: validated artifacts · definition 0.1.0</text>
  </g>
</svg>
